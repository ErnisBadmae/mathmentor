services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ege
      POSTGRES_PASSWORD: ege
      POSTGRES_DB: ege_mentor
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - ege_mentor_pg:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ege -d ege_mentor"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://ege:ege@postgres:5432/ege_mentor
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
        VITE_API_TOKEN: ${API_SHARED_TOKEN:-}
        VITE_OPERATOR_MODE_AVAILABLE: ${VITE_OPERATOR_MODE_AVAILABLE:-true}
    depends_on:
      - api
    ports:
      - "8088:80"
    restart: unless-stopped

  # Ученический тренажёр в Telegram (дрилл + срез + ИИ-оценка). Long-poll, без портов.
  # Требует в .env: TELEGRAM_BOT_TOKEN, TELEGRAM_STUDENT_CHAT_ID и (если Telegram закрыт
  # напрямую) TELEGRAM_PROXY_URL или HTTPS_PROXY.
  bot:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://ege:ege@postgres:5432/ege_mentor
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-${HTTPS_PROXY:-}}
    command: ["python", "-m", "app.adapters.telegram.bot"]
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "scripts/telegram_getme_health.py"]
      interval: 1m
      timeout: 20s
      retries: 3
      start_period: 30s

volumes:
  ege_mentor_pg:
